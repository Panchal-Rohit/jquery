<!DOCTYPE html>
<html>

<head>
    <title>jQuery User Profile</title>
</head>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
    .active {
        color: green;
        font-weight: bold;
    }

    .inactive {
        color: red;
        font-weight: bold;
    }
</style>

<body>

    <div id="profileBox">

        <h2 id="title">User Profile</h2>

        <label>Name:</label>
        <input type="text" id="name" placeholder="Enter name">

        <br><br>

        <label>Email:</label>
        <input type="email" id="email" placeholder="Enter email">

        <br><br>

        <label>
            <input type="checkbox" id="active">
            Active User
        </label>

        <br><br>

        <button id="update">Update Profile</button>

        <p id="message"></p>

    </div>
    <script>

        $(function () {
            $("#update").click(function () {

                let name = $("#name").val();
                let email = $("#email").val();
                let active = $("#active").prop("checked");

                if (active) {

                    $("#message").text("Active User");

                    $("#message").removeClass("inactive");
                    $("#message").addClass("active");

                } else {

                    $("#message").text("Inactive User");

                    $("#message").removeClass("active");
                    $("#message").addClass("inactive");

                }

            });

        });

    </script>

</body>

</html>
